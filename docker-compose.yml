version: '3'
services:
  mysql:
    image: mysql:8.0
    container_name: nhonguista-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: nhonguista
      MYSQL_USER: nhonguista
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - .docker-data/mysql:/var/lib/mysql

  redis:
    image: redis:alpine
    container_name: nhonguista-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - .docker-data/redis:/data
